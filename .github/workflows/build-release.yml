name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
        id: ndk

      - name: Build arm64-v8a
        run: |
          ${{ steps.ndk.outputs.ndk-path }}/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./jni/Android.mk \
            NDK_APPLICATION_MK=./jni/Application.mk \
            NDK_OUT=./obj-arm64 \
            NDK_LIBS_OUT=./libs-arm64 \
            APP_ABI=arm64-v8a \
            -j4

      - name: Build armeabi-v7a
        run: |
          ${{ steps.ndk.outputs.ndk-path }}/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./jni/Android.mk \
            NDK_APPLICATION_MK=./jni/Application.mk \
            NDK_OUT=./obj-arm \
            NDK_LIBS_OUT=./libs-arm \
            APP_ABI=armeabi-v7a \
            -j4

      - name: Stage artifacts
        run: |
          mkdir -p artifacts/arm64-v8a artifacts/armeabi-v7a
          cp libs-arm64/arm64-v8a/panxcz_libtool artifacts/arm64-v8a/panxcz_libtool.sh
          cp libs-arm64/arm64-v8a/panxcz_libtool artifacts/arm64-v8a/panxcz_libtool.elf
          cp libs-arm64/arm64-v8a/panxcz_libtool artifacts/arm64-v8a/panxcz_libtool
          cp libs-arm/armeabi-v7a/panxcz_libtool artifacts/armeabi-v7a/panxcz_libtool.sh
          cp libs-arm/armeabi-v7a/panxcz_libtool artifacts/armeabi-v7a/panxcz_libtool.elf
          cp libs-arm/armeabi-v7a/panxcz_libtool artifacts/armeabi-v7a/panxcz_libtool
          chmod +x artifacts/arm64-v8a/* artifacts/armeabi-v7a/*

      - name: Verify 16KB page alignment
        run: |
          echo "=== 16KB page-size check ==="
          for f in artifacts/arm64-v8a/*.so artifacts/armeabi-v7a/*.so artifacts/arm64-v8a/panxcz_libtool* artifacts/armeabi-v7a/panxcz_libtool*; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            readelf -lW "$f" | grep LOAD | while read line; do
              align=$(echo "$line" | grep -o 'align=0x[0-9a-f]*' | cut -d= -f2)
              if [ "$align" != "0x4000" ]; then
                echo "FAIL: $f has align=$align (expected 0x4000)"
                exit 1
              fi
            done || exit 1
          done
          echo "ALL PASS: every LOAD segment aligned to 16KB"

      - name: Verify symbol exports
        run: |
          echo "=== Symbol export check ==="
          for map in menu.map.txt dumper.map.txt zygisk.map.txt; do
            echo "--- $map ---"
            for sym in $(grep -v '^#' "$map" | awk '{print $2}'); do
              found=0
              for f in artifacts/arm64-v8a/* artifacts/armeabi-v7a/*; do
                [ -f "$f" ] || continue
                if readelf --dyn-syms -W "$f" 2>/dev/null | grep -q " ${sym}$"; then
                  found=1; break
                fi
              done
              if [ $found -eq 0 ]; then
                echo "MISSING: $sym (not exported in any binary)"
                exit 1
              fi
            done
          done
          echo "ALL PASS: every map entry exported"

      - name: Create release package
        run: |
          VERSION=$(git describe --tags --always)
          mkdir -p release
          tar -czf release/panxcz-libtool-${VERSION}-arm64.tar.gz -C artifacts/arm64-v8a .
          tar -czf release/panxcz-libtool-${VERSION}-arm.tar.gz -C artifacts/armeabi-v7a .
          ls -lh release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panxcz-libtool-${{ github.ref_name }}
          path: release/
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

